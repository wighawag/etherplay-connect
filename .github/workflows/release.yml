name: release

# Changesets release flow:
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and updates changelogs from the pending changesets.
#   3. Merging that PR (which removes the changesets) makes this workflow run
#      `changeset publish`, publishing the changed packages to npm.
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + workflow (release.yml) via the trusted publisher registered on each
# package's npmjs.com settings. The OIDC handshake needs `id-token: write`,
# Node >= 22 (npm CLI >= 11.5.1), and pnpm 10.x; publishes are stamped with
# provenance.
#
# Two setup gotchas, both one-time and per package, and both now DONE for every
# package here:
#   - OIDC cannot publish the FIRST version of a package (npm/cli#8544): the
#     trusted publisher can only be registered on a package that already exists.
#     The workaround is one manual `pnpm publish` of a placeholder, after which
#     this workflow owns every subsequent version. `@etherplay/openfort`,
#     `@etherplay/delegation` and `@etherplay/dev-wallet-host` each went through
#     it; a NEW package added later has to do the same before its first release.
#   - Every published package (@etherplay/connect, connect-core, delegation,
#     wallet-connector, wallet-connector-ethereum, openfort, dev-wallet-host)
#     needs its own trusted publisher entry on npmjs.com pointing at this repo
#     and this workflow filename.
#
# `@etherplay/dev-wallet-host` ships a PREBUILT bundle rather than source, so
# what it publishes depends on something having been built: `release:ci` runs
# the root `prepublishOnly`, which now builds it, and the package's own
# `prepack` rebuilds it from `web/` regardless. Both, deliberately: publishing
# an empty or stale `site/` would look like a working install and fail only at
# the moment somebody tried to sign in.
on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab, e.g. to (re-)run the Version-PR / publish
  # step after a merge that did not emit a push event (a GITHUB_TOKEN API merge
  # does not trigger `on: push`), or to re-publish idempotently.
  workflow_dispatch: {}

# Serialize release runs on main, but NEVER cancel an in-progress one:
# `changeset publish` may be mid-publish, and cancelling it would drop the
# release. `changeset publish` is idempotent (it skips versions already on npm),
# so letting each queued run finish is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publishing is gated on the tests, not only on `release:ci`'s format
      # check and build. @etherplay/delegation exists because agreement between
      # a Solidity implementation and a TypeScript one fails SILENTLY, and a
      # publish that skipped the test pinning them would ship exactly the
      # failure the package was created to catch. Same command as test.yml.
      - name: Test
        run: pnpm --filter './packages/*' --filter ./web run test

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # release:ci format-checks + builds the packages then runs
          # `changeset publish` (the action itself handles git commits/tags, so
          # no git push here). No NPM_TOKEN: npm detects the OIDC environment
          # and authenticates via the registered trusted publisher.
          publish: pnpm release:ci
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
